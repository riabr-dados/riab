table: captacao_por_projeto_investidor
description: Cada linha preserva um registro da planilha de captação por projeto e investidor, com nomes, identificadores,
  data e valores por mecanismo. Aportes agregados por investidor e captação por projeto têm cartões próprios.
source_raw: ancine-captacao-por-projeto-investidor
grain: 'Uma linha por linha factual da planilha; chave técnica: hash_arquivo, fonte_aba, linha_origem.'
columns:
- name: linha_origem
  type: int64
  nullable: false
  description: Número da linha na planilha original, começando em 1.
- name: ano
  type: int64
  nullable: false
  description: Ano de captação; extraído do ano ou da data original.
- name: ano_captacao_original
  type: string
  nullable: false
  description: Conteúdo original da coluna intitulada Ano de captação.
- name: salic
  type: string
  nullable: false
  description: Código SALIC preservado como texto.
- name: titulo_projeto
  type: string
  nullable: false
  description: Nome do projeto na fonte.
- name: proponente
  type: string
  nullable: false
  description: Nome do proponente.
- name: cnpj_proponente
  type: string
  nullable: true
  description: CNPJ sem pontuação, completado à esquerda até 14 dígitos; não comprova validade cadastral.
- name: uf_proponente
  type: string
  nullable: false
  description: Uf proponente, conforme a fonte.
- name: nome_investidor
  type: string
  nullable: true
  description: Nome do incentivador/investidor na fonte.
- name: cnpj_investidor_ou_contribuinte
  type: string
  nullable: true
  description: CNPJ sem pontuação, completado à esquerda até 14 dígitos; nulo para identificação não numérica.
- name: uf_investidor
  type: string
  nullable: true
  description: Uf investidor, conforme a fonte.
- name: data_captacao
  type: datetime64[us]
  nullable: false
  description: Data de captação registrada na origem.
- name: captado_lei_rouanet
  type: string
  nullable: false
  description: Valor nominal em BRL do mecanismo lei_rouanet.
- name: captado_art1
  type: string
  nullable: false
  description: Valor nominal em BRL do mecanismo art1.
- name: captado_art1a
  type: string
  nullable: false
  description: Valor nominal em BRL do mecanismo art1a.
- name: captado_art3
  type: string
  nullable: false
  description: Valor nominal em BRL do mecanismo art3.
- name: captado_art3a
  type: string
  nullable: false
  description: Valor nominal em BRL do mecanismo art3a.
- name: captado_art39
  type: string
  nullable: false
  description: Valor nominal em BRL do mecanismo art39.
- name: captado_funcines
  type: string
  nullable: false
  description: Valor nominal em BRL do mecanismo funcines.
- name: cnpj_proponente_original
  type: string
  nullable: true
  description: Texto original, sem normalização de identificadores.
- name: cnpj_investidor_ou_contribuinte_original
  type: string
  nullable: false
  description: Texto original, sem normalização de identificadores.
- name: moeda
  type: str
  nullable: false
  description: BRL, valores nominais.
- name: fonte_arquivo
  type: str
  nullable: false
  description: Nome do arquivo original.
- name: fonte_aba
  type: str
  nullable: false
