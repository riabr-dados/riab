notes:
- CNPJ original preserva inclusive a indicação Empresa Estrangeira.
- Valores não são arredondados; podem conter frações de centavo publicadas pela fonte.
- 'Schema revisado: o recurso legado que misturava três fontes foi substituído por três recursos separados.'
