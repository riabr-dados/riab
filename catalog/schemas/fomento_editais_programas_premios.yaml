table: fomento_editais_programas_premios
description: Valores anuais de editais, programas e prêmios, com moeda original explícita.
source_raw: ancine-fomento-editais-programas-premios
columns:
- name: ano
  type: int64
  nullable: true
  description: Ano de referência.
- name: mecanismo_ou_programa
  type: large_string
  nullable: true
  description: Mecanismo, edital, programa ou prêmio da linha original.
- name: linha_origem
  type: int64
  nullable: true
  description: Número da linha no arquivo oficial, começando em 1.
- name: fonte_arquivo
  type: large_string
  nullable: true
  description: Nome do arquivo oficial usado na extração.
- name: fonte_url
  type: large_string
  nullable: true
  description: URL oficial do arquivo de origem.
- name: hash_arquivo
  type: large_string
  nullable: true
  description: SHA-256 do arquivo bruto.
- name: data_coleta
  type: large_string
  nullable: true
  description: Data do snapshot local da fonte.
- name: moeda_original
  type: large_string
  nullable: true
  description: 'Moeda declarada pela célula original: BRL, USD ou EUR.'
- name: valor_original
  type: decimal
  nullable: true
  description: Valor nominal na moeda original, sem conversão cambial.
notes:
- Cada recurso contém uma única medida e granularidade.
- Linhas de total da planilha não são duplicadas na tabela factual.
- Valores são decimais; ausências permanecem nulas e não são convertidas em zero.
