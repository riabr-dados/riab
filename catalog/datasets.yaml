  - slug: ancine-obras-nao-publicitarias
    title: "Obras Nao Publicitarias"
    description: >
      Registro oficial de obras audiovisuais brasileiras nao publicitarias (filmes,
      series, documentarios, animacoes, videomusicais, etc.). Um arquivo CSV por ano
      de registro (2002-2026), totalizando aproximadamente 61.360 obras.
    source_id: ancine
    status: ativo
    coverage: "2002-2026"
    tags: [cinema, obras, registro, brasil, ancine, sav]
    raw:
      path: ancine-obras-nao-publicitarias/
      format: csv
      encoding: latin-1
      delimiter: ";"
      files: 25
      size_bytes: 16000000
    cleaned:
      tables: [obras]
    related:
      - ancine-diretores-obras
      - ancine-produtores-obras
      - ancine-bilheteria-consolidada

    categoria:
      - producao_obras
    procedencia: pda
    subfonte: ancine_pda
